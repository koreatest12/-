name: Verify Setup Script

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'

      - name: Verify Node Package Availability
        run: npm view @modelcontextprotocol/server-github version
